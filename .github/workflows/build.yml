name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Build debug APK (with retry against transient 429s)
        run: |
          for attempt in 1 2 3 4 5; do
            echo "=========================================="
            echo "=== Build attempt $attempt of 5 ==="
            echo "=========================================="
            if gradle assembleDebug --no-daemon --stacktrace; then
              echo "✅ Build succeeded on attempt $attempt"
              exit 0
            fi
            if [ $attempt -lt 5 ]; then
              WAIT=$((attempt * 30))
              echo "⏳ Attempt $attempt failed. Waiting ${WAIT}s for Maven rate limit to reset..."
              sleep $WAIT
            fi
          done
          echo "❌ All 5 attempts failed. This is not a transient issue — check the code."
          exit 1
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.repository.max.retries=5
            -Dorg.gradle.internal.repository.initial.backoff=1000

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeartbrokenTV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
